name: Roxy 1.7.10 bug report
description: Incompatibility, visual bug, crash, performance issue or other backport problem
title: "[1.7.10] "
body:
  - type: markdown
    attributes:
      value: |
        For the Java 21+ Minecraft 1.7.10 backport. Read the [reporting guide](https://github.com/fenflow/Roxy-1.7.10-Java21/blob/backport/1.7.10-gtnh/versions/1.7.10/BUG_REPORTING.md) and search existing issues first.
        Review/redact attachments before posting: logs and recordings may contain private data. Do not upload credentials, whole instances or world saves.
  - type: dropdown
    id: category
    attributes:
      label: Issue type
      options:
        - Visual bug
        - Mod or shader incompatibility
        - Crash or startup failure
        - Performance or stuttering
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Expected and actual behavior
      description: Describe the problem and affected blocks, mods or dimensions. For performance, include FPS or stall duration if known.
    validations:
      required: true
  - type: textarea
    id: pack
    attributes:
      label: GTNH version OR other modpack and mod list
      description: "GTNH: exact version and added/removed/updated mods. Other packs: name/version (or custom pack) AND attach/paste the full mod list with versions."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Roxy, dependencies and hardware
      description: Include Roxy and Voxy versions, Java actually used by the launcher, OS, GPU/driver and relevant dependency versions. You may refer to an attached support report for values it contains. State singleplayer or multiplayer without sharing a server address.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps and frequency
      description: Numbered steps if known, frequency, and tests/workarounds already tried. If unknown or intermittent, describe what you were doing.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Support report and logs / crash reports
      description: "Run /roxy report after the problem and attach .minecraft/roxy/support-report.txt plus same-session logs/fml-client-latest.log and logs/latest.log if available. For crashes attach the matching crash-reports/*.txt (or hs_err_pid*.log for JVM crashes). Drag files here; zip large logs. If unavailable, explain why. Review and redact first."
    validations:
      required: true
  - type: textarea
    id: visuals
    attributes:
      label: Screenshots / video and graphics settings
      description: For visual issues attach screenshots/video, shader pack/version/preset and changed settings, resource packs and both render distances. Include on/off comparisons if feasible. Otherwise write not applicable.
    validations:
      required: true
