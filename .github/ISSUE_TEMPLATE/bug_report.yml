name: Roxy 1.7.10 bug report
description: Incompatibility, visual bug, crash, performance issue or other backport problem
title: "[1.7.10] "
body:
  - type: markdown
    attributes:
      value: |
        For the Java 21+ Minecraft 1.7.10 backport. Search existing issues first.
        Review attachments before posting and redact private information. Hardware and driver details can be read from the support report; you do not need to enter them manually.
  - type: textarea
    id: versions
    attributes:
      label: Roxy and Voxy version. Java version.
      description: Which versions of Roxy and the Voxy JAR are you using? Which Java version are you using?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Expected and actual behavior
      description: Describe the problem and affected blocks, mods or dimensions. For performance, include FPS or stall duration if known.
    validations:
      required: true
  - type: textarea
    id: pack
    attributes:
      label: GTNH version OR other modpack and mod list. Also include Java version
      description: "GTNH: exact version and added/removed/updated mods. Other packs: name/version (or custom pack) AND attach/paste the full mod list with versions. Which Java version was used?"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps and frequency if applicable
      description: Numbered steps if known, frequency, and tests/workarounds already tried. If unknown or intermittent, describe what you were doing.
    validations:
      required: false
  - type: textarea
    id: diagnostics
    attributes:
      label: /roxy report file, logs and crash reports
      description: "Run `/roxy report` after the problem and attach .minecraft/roxy/support-report.txt plus same-session logs/fml-client-latest.log and logs/latest.log if available. For crashes attach the matching crash-reports/*.txt (or hs_err_pid*.log for JVM crashes). Drag files here; zip large logs. If the command cannot run or files are unavailable, explain why."
    validations:
      required: true
  - type: textarea
    id: visuals
    attributes:
      label: Screenshots for visual bugs if applicable
      description: For visual issues attach screenshots/video, shader pack/version/preset and changed settings, resource packs and both render distances. Include on/off comparisons if feasible. Otherwise write not applicable.
    validations:
      required: false
